<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万森小镇 · 俯视像素镇</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>◭ 万森小镇</h1>
      <div class="subtitle">像素小镇 · 6 位居民慢生活</div>
    </div>
    <div class="meta" id="meta">
      <span class="meta-date" id="meta-date">—</span>
      <span class="meta-phase" id="meta-phase">—</span>
      <span class="meta-vin" id="vin">第 0 帧</span>
    </div>
  </header>

  <main class="layout">
    <!-- 中部：单张俯视像素地图 -->
    <section class="map-section">
      <div class="map" id="map">
        <!-- 地图底图 + 6 位居民由 app.js 动态生成 -->
      </div>
    </section>

    <!-- 底部：小镇动态 -->
    <section class="news-section">
      <h2 class="news-title">▤ 小镇动态</h2>
      <ul class="timeline" id="events">
        <li class="timeline-empty">正在读取快照……</li>
      </ul>
    </section>
  </main>

  <footer class="foot" id="foot">快照读取中……</footer>

<script src="app.js"></script>
</body>
</html>
