<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万森小镇 · 看戏台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>🏘️ 万森小镇</h1>
      <div class="subtitle">温馨治愈 · Q版慢生活</div>
    </div>
    <div class="meta" id="meta">
      <span class="meta-date" id="meta-date">—</span>
      <span class="meta-phase" id="meta-phase">—</span>
      <span class="meta-vin" id="vin">第 0 帧</span>
    </div>
  </header>

  <main class="layout">
    <!-- 中部：小镇地图 -->
    <section class="map-section">
      <h2 class="map-title">🗺️ 小镇地图</h2>
      <div class="map" id="map"><!-- 6 站点卡片由 app.js 动态生成 --></div>
    </section>

    <!-- 底部：小镇动态 -->
    <section class="news-section">
      <h2 class="news-title">📰 小镇动态</h2>
      <ul class="timeline" id="events">
        <li class="timeline-empty">正在读取快照……</li>
      </ul>
    </section>
  </main>

  <footer class="foot" id="foot">快照读取中……</footer>

<script src="app.js"></script>
</body>
</html>
